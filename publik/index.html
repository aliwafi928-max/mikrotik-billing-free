<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MikroTik Billing Cloud</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

  <!-- HALAMAN AWAL: LOGIN MIKROTIK -->
  <div id="loginView" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl">
      <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-white">MikroTik PPPoE Billing</h1>
        <p class="text-sm text-slate-400 mt-1">Masukkan data Router MikroTik Anda untuk masuk</p>
      </div>

      <div id="loginError" class="hidden mb-4 p-3 rounded-lg bg-red-950 border border-red-800 text-red-300 text-xs"></div>

      <div class="space-y-3 text-sm">
        <div class="grid grid-cols-3 gap-3">
          <div class="col-span-2">
            <label class="block text-slate-400 mb-1">IP / Domain MikroTik</label>
            <input id="inHost" type="text" placeholder="Contoh: id-1.vpnremote.id" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white" />
          </div>
          <div>
            <label class="block text-slate-400 mb-1">Port API</label>
            <input id="inPort" type="number" value="8728" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white" />
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-400 mb-1">Username</label>
            <input id="inUser" type="text" placeholder="admin" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white" />
          </div>
          <div>
            <label class="block text-slate-400 mb-1">Password</label>
            <input id="inPass" type="password" placeholder="••••••" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white" />
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-400 mb-1">Profile Isolir</label>
            <input id="inIsolir" type="text" value="isolir" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white" />
          </div>
          <div>
            <label class="block text-slate-400 mb-1">Token Fonnte (Opsional)</label>
            <input id="inToken" type="text" placeholder="Token WA Auto" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white" />
          </div>
        </div>
        <button id="btnLogin" onclick="doLogin()" class="w-full mt-2 bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-lg transition">
          Hubungkan ke MikroTik
        </button>
      </div>
      <p class="text-[11px] text-slate-500 text-center mt-4">Data login hanya tersimpan di browser perangkat Anda sendiri.</p>
    </div>
  </div>

  <!-- HALAMAN DASHBOARD BILLING -->
  <div id="dashboardView" class="hidden p-6 max-w-7xl mx-auto">
    <div class="flex flex-wrap justify-between items-center mb-6 gap-4">
      <div>
        <h1 class="text-2xl font-bold text-white">MikroTik PPPoE Billing</h1>
        <p class="text-sm text-slate-400">Terhubung ke: <span id="activeHost" class="text-blue-400 font-mono font-semibold"></span></p>
      </div>
      <div class="flex flex-wrap gap-2">
        <button onclick="loadUsers()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-medium">Refresh Data</button>
        <button onclick="resetMonth()" class="bg-amber-600 hover:bg-amber-500 text-white px-4 py-2 rounded-lg text-sm font-medium">Reset Bulan Baru</button>
        <button onclick="doLogout()" class="bg-red-900/70 hover:bg-red-800 border border-red-700 text-red-200 px-4 py-2 rounded-lg text-sm font-medium">Keluar / Ganti Router</button>
      </div>
    </div>

    <div id="alert" class="hidden mb-4 p-4 rounded-lg text-sm font-medium"></div>

    <div class="bg-slate-900 border border-slate-800 rounded-xl shadow overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-slate-800/70 border-b border-slate-800 text-xs uppercase text-slate-400">
            <th class="p-4">User PPPoE</th>
            <th class="p-4">Koneksi</th>
            <th class="p-4">Profile</th>
            <th class="p-4">Tagihan (Rp)</th>
            <th class="p-4">Jatuh Tempo</th>
            <th class="p-4">No. WA (628...)</th>
            <th class="p-4">Status & Tgl Bayar</th>
            <th class="p-4 text-right">Aksi</th>
          </tr>
        </thead>
        <tbody id="userTable" class="divide-y divide-slate-800 text-sm"></tbody>
      </table>
    </div>
  </div>

  <script>
    function getSession() {
      const raw = localStorage.getItem('mt_billing_session');
      return raw ? JSON.parse(raw) : null;
    }

    function getHeaders() {
      const s = getSession() || {};
      return {
        'Content-Type': 'application/json',
        'x-mt-host': s.host || '',
        'x-mt-port': s.port || '8728',
        'x-mt-user': s.user || '',
        'x-mt-pass': s.password || '',
        'x-mt-isolir': s.isolirProfile || 'isolir',
        'x-wa-token': s.fonnteToken || ''
      };
    }

    function showAlert(msg, isError = false) {
      const el = document.getElementById('alert');
      el.textContent = msg;
      el.className = `mb-4 p-4 rounded-lg text-sm font-medium ${isError ? 'bg-red-950 text-red-300 border border-red-800' : 'bg-emerald-950 text-emerald-300 border border-emerald-800'}`;
      el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 5000);
    }

    async function doLogin() {
      const btn = document.getElementById('btnLogin');
      const errBox = document.getElementById('loginError');
      errBox.classList.add('hidden');

      const session = {
        host: document.getElementById('inHost').value.trim(),
        port: document.getElementById('inPort').value.trim() || '8728',
        user: document.getElementById('inUser').value.trim(),
        password: document.getElementById('inPass').value,
        isolirProfile: document.getElementById('inIsolir').value.trim() || 'isolir',
        fonnteToken: document.getElementById('inToken').value.trim()
      };

      if (!session.host || !session.user) {
        errBox.textContent = 'IP/Domain dan Username MikroTik wajib diisi.';
        errBox.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Menghubungkan...';
      localStorage.setItem('mt_billing_session', JSON.stringify(session));

      try {
        const res = await fetch('/api/login', { method: 'POST', headers: getHeaders() });
        const json = await res.json();
        if (!json.success) throw new Error(json.message);
        openDashboard();
      } catch (err) {
        localStorage.removeItem('mt_billing_session');
        errBox.textContent = err.message;
        errBox.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Hubungkan ke MikroTik';
      }
    }

    function doLogout() {
      localStorage.removeItem('mt_billing_session');
      document.getElementById('dashboardView').classList.add('hidden');
      document.getElementById('loginView').classList.remove('hidden');
    }

    function openDashboard() {
      const s = getSession();
      document.getElementById('activeHost').textContent = `${s.host}:${s.port}`;
      document.getElementById('loginView').classList.add('hidden');
      document.getElementById('dashboardView').classList.remove('hidden');
      loadUsers();
    }

    async function loadUsers() {
      const tbody = document.getElementById('userTable');
      tbody.innerHTML = '<tr><td colspan="8" class="p-6 text-center text-slate-500">Memuat data dari MikroTik...</td></tr>';
      try {
        const res = await fetch('/api/users', { headers: getHeaders() });
        const json = await res.json();
        if (!json.success) throw new Error(json.message);
        if (json.data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="8" class="p-6 text-center text-slate-500">Tidak ada user PPPoE di MikroTik ini.</td></tr>';
          return;
        }
        const today = new Date().getDate();
        tbody.innerHTML = json.data.map(u => {
          const isOverdue = u.status !== 'LUNAS' && today > u.dueDate;
          return `
          <tr class="hover:bg-slate-800/40">
            <td class="p-4 font-semibold text-white">${u.name}</td>
            <td class="p-4"><span class="px-2 py-1 rounded-full text-xs font-medium ${u.online ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-slate-800 text-slate-400'}">${u.online ? 'Online' : 'Offline'}</span></td>
            <td class="p-4"><span class="${u.isIsolated ? 'text-red-400 font-bold' : 'text-slate-300'}">${u.profile}</span></td>
            <td class="p-4"><input id="price-${u.name}" type="number" value="${u.price}" onchange="saveRow('${u.name}', '${u.originalProfile}')" class="w-28 bg-slate-950 border border-slate-700 text-slate-100 rounded px-2 py-1 text-sm" /></td>
            <td class="p-4">
              <div class="flex items-center gap-1">
                <span class="text-xs text-slate-400">Tgl</span>
                <input id="due-${u.name}" type="number" min="1" max="28" value="${u.dueDate}" onchange="saveRow('${u.name}', '${u.originalProfile}')" class="w-14 bg-slate-950 border ${isOverdue ? 'border-red-500 text-red-400' : 'border-slate-700 text-slate-100'} rounded px-2 py-1 text-sm text-center" />
              </div>
            </td>
            <td class="p-4"><input id="wa-${u.name}" type="text" placeholder="62812..." value="${u.phone}" onchange="saveRow('${u.name}', '${u.originalProfile}')" class="w-32 bg-slate-950 border border-slate-700 text-slate-100 rounded px-2 py-1 text-sm" /></td>
            <td class="p-4">
              <span class="px-2 py-1 rounded-full text-xs font-semibold ${u.status === 'LUNAS' ? 'bg-emerald-950 text-emerald-400' : 'bg-red-950 text-red-400'}">${u.status}</span>
              <div class="mt-1.5"><input id="paid-${u.name}" type="date" value="${u.lastPaid}" onchange="saveRow('${u.name}', '${u.originalProfile}')" class="bg-slate-950 border border-slate-700 text-slate-200 rounded px-2 py-0.5 text-xs" /></div>
            </td>
            <td class="p-4 text-right space-x-1 whitespace-nowrap">
              <button onclick="payUser('${u.id}', '${u.name}')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-2.5 py-1.5 rounded text-xs font-medium">Lunas</button>
              <button onclick="isolateUser('${u.id}', '${u.name}', '${u.profile}')" class="bg-red-600 hover:bg-red-500 text-white px-2.5 py-1.5 rounded text-xs font-medium">Isolir</button>
              <button onclick="sendManualWA('${u.name}')" class="bg-green-600 hover:bg-green-500 text-white px-2.5 py-1.5 rounded text-xs font-medium">WA</button>
            </td>
          </tr>`;
        }).join('');
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="8" class="p-6 text-center text-red-400">${err.message}</td></tr>`;
      }
    }

    async function saveRow(name, originalProfile) {
      await fetch('/api/users/update', {
        method: 'POST',
        headers: getHeaders(),
        body: JSON.stringify({
          name,
          price: document.getElementById(`price-${name}`).value,
          phone: document.getElementById(`wa-${name}`).value,
          dueDate: document.getElementById(`due-${name}`).value,
          lastPaid: document.getElementById(`paid-${name}`).value,
          originalProfile
        })
      });
      showAlert(`Data ${name} tersimpan.`);
    }

    async function payUser(id, name) {
      const res = await fetch('/api/billing/pay', { method: 'POST', headers: getHeaders(), body: JSON.stringify({ id, name }) });
      const json = await res.json();
      showAlert(json.message, !json.success);
      loadUsers();
    }

    async function isolateUser(id, name, currentProfile) {
      if (!confirm(`Yakin ingin mengisolir ${name}?`)) return;
      const res = await fetch('/api/billing/isolate', { method: 'POST', headers: getHeaders(), body: JSON.stringify({ id, name, currentProfile }) });
      const json = await res.json();
      showAlert(json.message, !json.success);
      loadUsers();
    }

    function sendManualWA(name) {
      const phone = document.getElementById(`wa-${name}`).value;
      const price = document.getElementById(`price-${name}`).value;
      const due = document.getElementById(`due-${name}`).value;
      if (!phone) return alert('Isi nomor WA terlebih dahulu (628xxx).');
      const text = encodeURIComponent(`Halo ${name}, tagihan internet bulan ini Rp ${Number(price).toLocaleString('id-ID')} (jatuh tempo Tgl ${due}). Terima kasih.`);
      window.open(`https://wa.me/${phone}?text=${text}`, '_blank');
    }

    async function resetMonth() {
      if (!confirm('Reset semua tagihan router ini jadi BELUM BAYAR?')) return;
      const res = await fetch('/api/billing/reset-month', { method: 'POST', headers: getHeaders() });
      const json = await res.json();
      showAlert(json.message);
      loadUsers();
    }

    // Cek apakah browser ini sudah pernah login
    if (getSession()) openDashboard();
  </script>
</body>
</html>
