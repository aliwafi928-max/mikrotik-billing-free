<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MikroTik PPPoE Billing</title>
</head>
<body style="background:#092154;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;">
  <p id="status">Memuat aplikasi MikroTik PPPoE Billing...</p>
  <script>
    fetch('/?app=1', { cache: 'no-store' })
      .then(r => r.text())
      .then(html => {
        document.open();
        document.write(html);
        document.close();
      })
      .catch(() => {
        document.getElementById('status').textContent = 'Gagal memuat aplikasi. Coba refresh halaman.';
      });
  </script>
</body>
</html>
